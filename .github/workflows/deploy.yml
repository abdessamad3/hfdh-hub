name: Build and deploy

# Pull requests: type-check and build, so broken changes are caught before merge.
# Pushes to main: also deploy the site and the Firestore rules to Firebase.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy hosting and Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is not set. See README.md, section 'Automatic deploys'."
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15.33.0 deploy \
            --only firestore:rules,hosting \
            --project hifd-kouttab \
            --non-interactive \
            --message "GitHub ${{ github.sha }}"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
