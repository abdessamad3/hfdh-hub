name: Build and deploy

# Pull requests: type-check and build (the app and the recitation lab), so broken changes are caught before merge.
# Pushes to main: also deploy the site and the Firestore rules to Firebase.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # The recitation test page is a separate small site with its own build.
      - name: Build recitation lab
        working-directory: recitation-lab
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: |
            dist
            recitation-lab/dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub prove to Google which repo/branch is deploying
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: site
          path: .

      # Keyless login (Workload Identity Federation): Google trusts GitHub's
      # token for this repo on main. Set up by scripts/setup-github-deploy.sh.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/141386006809/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@hifd-kouttab.iam.gserviceaccount.com

      - name: Deploy hosting and Firestore rules
        run: >
          npx --yes firebase-tools@15.33.0 deploy
          --only firestore:rules,hosting
          --project hifd-kouttab
          --non-interactive
          --message "GitHub ${{ github.sha }}"
